<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Self in Layers – Mark Jerwin Malacura</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe9f6;--ink:#26203a;--card:#fff;--mut:#5d5578;--line:#d6cbe6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171326;--ink:#f1ecfa;--card:#241d3a;--mut:#b4aacd;--line:#3b3158}}
:root[data-theme="dark"]{--bg:#171326;--ink:#f1ecfa;--card:#241d3a;--mut:#b4aacd;--line:#3b3158}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:20px 18px 48px}
h1{font-size:2.3rem;line-height:1.05;font-weight:800;margin:.2em 0}
h2{font-size:1.6rem;margin:.2em 0}
p{margin:.6em 0}.mut{color:var(--mut)}
button{font:inherit;cursor:pointer;border:0}
.btn{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.menu button{background:var(--card);border:2px solid var(--c);color:var(--ink);padding:12px;border-radius:14px;text-align:left;font-weight:600}
.menu button:hover,.menu button:focus-visible{background:var(--c);color:#fff}
svg.onion{width:100%;max-width:340px;display:block;margin:12px auto}
svg.onion circle{cursor:pointer;stroke:var(--bg);stroke-width:3}
svg.onion circle:hover{opacity:.8}
.card{background:var(--card);border-left:8px solid var(--c,var(--ink));border-radius:14px;padding:14px 16px;margin:14px 0}
.sym{font-size:4rem;line-height:1}
.theory{border:2px dashed var(--c);border-radius:12px;padding:10px 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.opt{display:block;width:100%;margin:6px 0;padding:10px;border-radius:10px;background:var(--card);border:2px solid var(--line);color:var(--ink);text-align:left}
.ok{border-color:#2e9d5b!important}.no{border-color:#c9453f!important}
:focus-visible{outline:3px solid #8a5cf6;outline-offset:2px}
</style></head><body><main id="app"></main>

const L=[
{k:'phys',n:'Physical Self',e:'💪',c:'#d9534f',d:'Every morning I do 15 push-ups for 3 sets to keep my body strong and healthy. Exercising at home is the biggest part of how I see my body.',t:'William James – Material Self: the body is part of the "Me", so my strength and discipline are part of who I am.',r:'I learned the body is valued for what it can do, not only how it looks. I want to be more consistent and add better sleep and food to my routine.'},
{k:'fam',n:'Family and Social Self',e:'🏠',c:'#e08a1e',d:'I am the fourth among my siblings. My role is the helper: I assist my older brother in fixing vehicles, like cleaning a car starter, and I help Mama with work inside the house.',t:'George Herbert Mead – significant others: my brother and Mama shaped my hardworking, helpful side.',r:'Being part of a family means giving support, not only receiving it. I want to help sooner, even before I am asked.'},
{k:'mat',n:'Material/Economic Self',e:'💰',c:'#2e9d5b',d:'I save part of my allowance so I have money for emergencies and for school supplies.',t:'William James – Material Self: what I own and save reflects what I value. I also separate needs from wants.',r:'Splitting needs and wants keeps me from wasting money. I want to keep saving and set a clear target amount.'},
{k:'spir',n:'Spiritual Self',e:'🙏',c:'#3a8fd6',d:'I pray every night before sleeping. I thank God for my day and ask for guidance for tomorrow.',t:'William James – Spiritual Self: my inner beliefs, values and awareness of myself.',r:'Faith is a daily habit, not only for hard times. Prayer gives me peace and reminds me what matters. I want to be more grateful and show it to others.'},
{k:'dig',n:'Digital Self',e:'📱',c:'#8a5cf6',d:'I use Facebook and TikTok to pass the time. I watch educational reels to learn, and funny videos to relax and have fun.',t:'Erving Goffman – front stage and backstage: online I am more of a viewer than a poster.',r:'Social media is good when I choose what to watch. I want to manage my screen time so it does not take away from studying and exercise.'},
{k:'core',n:'Core Self',e:'⚖️',c:'#c2418f',d:'My core values are discipline and fairness to others. Discipline shows in my exercise, saving and prayer. Fairness shows in how I treat my family and other people.',t:'Erik Erikson – Identity vs. Role Confusion: at my age I am building my identity, and these values are its foundation.',r:'All my layers come from the same values. I want to keep them as I grow and become more responsible.'}];

<div class="card"><h2>Who am I?</h2><p>I am Mark Jerwin, a BSIT student and the fourth child in my family. I am hardworking, disciplined and fair. I stay strong through daily exercise, save money for what I need, pray every night, and help my family. This profile peels back my layers one at a time.</p></div>

function syn(){A.innerHTML=`<h2>Synthesis</h2><div class="card"><p>My layers support each other. The discipline in my <b>Physical Self</b> also shows in saving money (<b>Material</b>) and praying every night (<b>Spiritual</b>). My helpful role at home (<b>Family</b>) comes from fairness and hard work in my <b>Core Self</b>. My <b>Digital Self</b> can either support these habits when I learn from good content, or compete with them when I spend too much time online.</p></div>${nav()}`;scrollTo(0,0)}
let qi=0,sc=0;

function q(){if(qi>=Q.length){A.innerHTML=`<h2>Guess the layer</h2><div class="card"><p>You scored <b>${sc}/${Q.length}</b>.</p></div><div class="row"><button class="btn alt" onclick="quiz()">Play again</button><button class="btn" onclick="home()">Back to home</button></div>`;return}

document.getElementById('fb').innerHTML=(ok?'Correct! ':'Not quite. ')+`<button class="btn" onclick="qi++;q()">Continue</button>`}
